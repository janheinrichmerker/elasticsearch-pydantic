name: CI

on:
  push:

jobs:
  python-build:
    name: "🏗️ Build Python wheels"
    strategy:
      matrix:
        python:
          - "3.11"
          - "3.12"
          - "3.13"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Check-out"
        uses: actions/checkout@v6
      - name: "🧰 Install Python"
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: "🧰 Install dependencies"
        run: pip install build twine
      - name: "🏗️ Build Python wheels"
        run: python -m build
      - name: "🧪 Check package bundles"
        run: twine check dist/*
      - name: "📤 Upload Python wheels"
        uses: actions/upload-artifact@v6
        if: matrix.python == '3.13'
        with:
          name: wheels
          path: dist
  python-code-check:
    name: 🔍 Check Python code
    strategy:
      matrix:
        python:
          - "3.11"
          - "3.12"
          - "3.13"
        elasticsearch:
          - "6"
          - "6-major"
          - "7"
          - "7-major"
          - "8"
          - "8-major"
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check-out
        uses: actions/checkout@v6
      - name: 🧰 Install Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: 🧰 Install dependencies
        run: pip install .[tests,tests-es${{ matrix.elasticsearch }}]
      - name: 🔍 Check Python code
        run: ruff check .
  python-typing:
    name: "🔍 Check Python static typing"
    strategy:
      matrix:
        python:
          - "3.11"
          - "3.12"
          - "3.13"
        elasticsearch:
          - "6"
          - "6-major"
          - "7"
          - "7-major"
          - "8"
          - "8-major"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Check-out"
        uses: actions/checkout@v6
      - name: "🧰 Install Python"
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: "🧰 Install dependencies"
        run: pip install .[tests,tests-es${{ matrix.elasticsearch }}]
      - name: "🔍 Check Python static typing"
        run: mypy .
  python-test:
    name: "🧪 Test Python code"
    strategy:
      matrix:
        python:
          - "3.11"
          - "3.12"
          - "3.13"
        elasticsearch:
          - "6"
          - "6-major"
          - "7"
          - "7-major"
          - "8"
          - "8-major"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Check-out"
        uses: actions/checkout@v6
      - name: "🧰 Install Python"
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: "🧰 Install dependencies"
        run: pip install .[tests,tests-es${{ matrix.elasticsearch }}]
      - name: "🧪 Test Python code"
        run: pytest --cov --cov-report=xml .
      - name: "📤 Upload coverage to Codecov"
        uses: codecov/codecov-action@v5
        if: matrix.python == '3.13' && matrix.elasticsearch == '8-major'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
  python-publish:
    name: "🚀 Publish Python wheels"
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    needs:
      - python-build
      - python-code-check
      - python-typing
      - python-test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: "📥 Check-out"
        uses: actions/checkout@v6
      - name: "📥 Download Python wheels"
        uses: actions/download-artifact@v7
        with:
          name: wheels
          path: dist
      - name: "🚀 Publish Python wheels"
        uses: pypa/gh-action-pypi-publish@release/v1
  github-release:
    name: "🚀 Create GitHub release"
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    needs:
      - python-build
      - python-code-check
      - python-typing
      - python-test
      - python-publish
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Check-out"
        uses: actions/checkout@v6
      - name: "📥 Download Python wheels"
        uses: actions/download-artifact@v7
        with:
          name: wheels
          path: dist
      - name: "🚀 Create GitHub release"
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          generate_release_notes: true
